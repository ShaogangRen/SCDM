# Five complete 800-step observed trajectories, 1000 variables, 7142 edges.
dataset_format: npz
dataset_path: voxel1000_v1.npz
data_root: data
lag: 3
normalize: zscore
batch_size: 32
total_outer_steps: 500
tasks_per_outer_step: 32
target_sampling_mode: uniform_random
val_every_outer_steps: 100
val_episodes: 2
val_tasks_per_episode: 64
patience: 0
l_sup: 32
l_qry: 32
lambda_in: 0.03
lambda_out: 0.03
graph_readout: structural
run_source_isolated_readout: false
source_isolated_episodes: 0
threshold_mode: f1_max
top_k: 7142
seed: 0
output_dir: results/voxel1000_seed0
